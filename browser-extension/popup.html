<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResuMatch &#25237;&#36882;&#21516;&#27493;</title>
    <style>
      :root {
        --ink: #17202b;
        --panel: #f8fafc;
        --line: #d7e0ea;
        --blue: #2563eb;
        --mint: #0f9f7a;
        --amber: #d97706;
        --rose: #c2415d;
      }

      body {
        margin: 0;
        padding: 16px;
        width: 360px;
        background: linear-gradient(135deg, #f8fafc 0%, #eef4fb 100%);
        color: var(--ink);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 12px 24px rgba(23, 32, 43, 0.08);
        padding: 14px;
      }

      h1,
      h2,
      p,
      label {
        margin: 0;
      }

      h1 {
        font-size: 18px;
        line-height: 1.2;
      }

      h2 {
        font-size: 14px;
        line-height: 1.2;
      }

      .muted {
        margin-top: 8px;
        color: #5b6776;
        font-size: 12px;
        line-height: 1.6;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      button,
      a,
      select,
      input {
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
      }

      button,
      a {
        border: 0;
        padding: 10px 12px;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }

      select,
      input {
        border: 1px solid var(--line);
        padding: 8px 10px;
        color: var(--ink);
        background: white;
      }

      .primary {
        background: var(--blue);
        color: white;
      }

      .secondary {
        background: white;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .metric {
        border-radius: 8px;
        background: var(--panel);
        padding: 10px;
      }

      .metric-label {
        font-size: 11px;
        color: #5b6776;
      }

      .metric-value {
        margin-top: 4px;
        font-size: 22px;
        font-weight: 800;
      }

      .status {
        margin-top: 12px;
        min-height: 40px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--panel);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .status.success {
        color: var(--mint);
      }

      .status.error {
        color: var(--rose);
      }

      .status.warn {
        color: var(--amber);
      }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .health-grid {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .health-row {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px;
        align-items: start;
      }

      .health-label {
        font-size: 11px;
        font-weight: 700;
        color: #5b6776;
      }

      .health-value {
        font-size: 12px;
        line-height: 1.5;
        word-break: break-word;
      }

      .pill {
        display: inline-block;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
      }

      .pill.ok {
        background: rgba(15, 159, 122, 0.12);
        color: var(--mint);
      }

      .pill.warn {
        background: rgba(217, 119, 6, 0.12);
        color: var(--amber);
      }

      .pill.error {
        background: rgba(194, 65, 93, 0.12);
        color: var(--rose);
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="panel">
        <h1>ResuMatch &#21516;&#27493;</h1>
        <p class="muted">&#25226;&#24403;&#21069; Boss &#39029;&#38754;&#21516;&#27493;&#21040;&#26412;&#22320;&#24037;&#20316;&#21488;&#12290;</p>
        <div class="actions">
          <button id="sync" class="primary" type="button">&#21516;&#27493;&#24403;&#21069;&#39029;</button>
          <button id="open-workbench" class="secondary" type="button">&#25171;&#24320;&#24037;&#20316;&#21488;</button>
        </div>
        <div id="status" class="status">&#31561;&#24453;&#21516;&#27493;&#12290;</div>
      </div>

      <div class="panel">
        <h2>&#38544;&#31169;&#35774;&#32622;</h2>
        <label><input id="telemetry-enabled" type="checkbox" checked /> &#20801;&#35768;&#21311;&#21517;&#36816;&#34892;&#29366;&#24577;&#25968;&#25454;</label>
        <p class="muted">&#20165;&#29992;&#20110;&#25913;&#21892;&#20135;&#21697;&#65307;&#19981;&#20250;&#25910;&#38598;&#32593;&#22336;&#12289;&#22995;&#21517;&#12289;&#32842;&#22825;&#20869;&#23481;&#25110;&#20219;&#20309;&#36523;&#20221;&#20449;&#24687;&#12290;</p>
      </div>

      <div class="panel">
        <h2>&#25193;&#23637;&#33258;&#26816;</h2>
        <p class="muted">&#20808;&#26816;&#26597;&#21518;&#21488;&#12289;&#20869;&#23481;&#33050;&#26412;&#21644;&#24403;&#21069;&#26631;&#31614;&#39029;&#29366;&#24577;&#65292;&#20877;&#24448;&#19979;&#25490;&#26597;&#12290;</p>
        <div class="actions">
          <button id="refresh-health" class="secondary" type="button">&#21047;&#26032;&#33258;&#26816;</button>
          <button id="open-extensions" class="secondary" type="button">&#37325;&#36733;&#25351;&#24341;</button>
        </div>
        <div class="health-grid">
          <div class="health-row">
            <div class="health-label">&#21518;&#21488;</div>
            <div id="health-background" class="health-value"><span class="pill warn">&#26816;&#27979;&#20013;</span></div>
          </div>
          <div class="health-row">
            <div class="health-label">&#20869;&#23481;&#33050;&#26412;</div>
            <div id="health-content-script" class="health-value"><span class="pill warn">&#26816;&#27979;&#20013;</span></div>
          </div>
          <div class="health-row">
            <div class="health-label">&#39029;&#38754;&#31867;&#22411;</div>
            <div id="health-page-type" class="health-value">&#26816;&#27979;&#20013;</div>
          </div>
          <div class="health-row">
            <div class="health-label">&#24403;&#21069;&#26631;&#31614;&#39029;</div>
            <div id="health-tab-url" class="health-value">&#26816;&#27979;&#20013;</div>
          </div>
        </div>
        <div id="health-status" class="status">&#31561;&#24453;&#33258;&#26816;&#12290;</div>
      </div>

      <div class="panel">
        <h2>&#21382;&#21490;&#26816;&#32034;</h2>
        <p class="muted">&#22312; Boss &#32842;&#22825;&#39029;&#25191;&#34892;&#20302;&#39057;&#21382;&#21490;&#26816;&#32034;&#12290;&#21333;&#27425;&#26368;&#22810;&#25195;&#25551; 200 &#20010;&#20250;&#35805;&#65292;&#24182;&#24102;&#26377;&#20919;&#21364;&#20572;&#39039;&#12290;</p>
        <div class="field-grid">
          <label>
            &#26102;&#38388;&#33539;&#22260;
            <select id="history-range">
              <option value="7">&#36817; 7 &#22825;</option>
              <option value="30" selected>&#36817; 30 &#22825;</option>
              <option value="90">&#36817; 90 &#22825;</option>
              <option value="custom">&#33258;&#23450;&#20041;</option>
            </select>
          </label>
          <label>
            &#20250;&#35805;&#19978;&#38480;
            <input id="history-limit" type="number" min="1" max="200" value="200" />
          </label>
          <label>
            &#24320;&#22987;&#26102;&#38388;
            <input id="history-start" type="datetime-local" />
          </label>
          <label>
            &#32467;&#26463;&#26102;&#38388;
            <input id="history-end" type="datetime-local" />
          </label>
        </div>
        <div class="actions">
          <button id="sync-history" class="primary" type="button">&#24320;&#22987;&#21382;&#21490;&#26816;&#32034;</button>
          <button id="refresh-history-summary" class="secondary" type="button">&#21047;&#26032;&#21382;&#21490;&#32479;&#35745;</button>
        </div>
        <div class="summary-grid">
          <div class="metric">
            <div class="metric-label">&#26032;&#22238;&#22797;</div>
            <div id="history-reply-count" class="metric-value">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">&#32034;&#31616;&#21382;</div>
            <div id="history-resume-count" class="metric-value">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">&#36992;&#38754;</div>
            <div id="history-interview-count" class="metric-value">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">&#34917;&#24405;&#20250;&#35805;</div>
            <div id="history-supplement-count" class="metric-value">0</div>
          </div>
        </div>
        <div id="history-status" class="status">&#31561;&#24453;&#21382;&#21490;&#26816;&#32034;&#12290;</div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
